plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':common')

    implementation 'org.postgresql:postgresql:42.7.4'
    implementation 'org.mindrot:jbcrypt:0.4'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application {
    mainClass = 'vn.edu.p2p.tracker.TrackerApplication'
}

tasks.register('createUser', JavaExec) {
    group = 'application'
    description = 'Create an ACTIVE local test user in PostgreSQL'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'vn.edu.p2p.tracker.tools.CreateUserTool'
}

// One-time local Ed25519 provisioning. Does NOT overwrite existing keys.
tasks.register('generateTicketKeys', JavaExec) {
    group = 'application'
    description = 'Create local Ed25519 signing/public key pair (private is never printed)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'vn.edu.p2p.tracker.tools.TicketKeySetupTool'
    if (project.hasProperty('ticketKeysDir')) args project.property('ticketKeysDir').toString()
}
