allprojects {
    group = 'vn.edu.p2p'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        // Integration tests deliberately use loopback/plain-TCP fixtures.
        // Opt in ONLY for forked test JVMs; packaged applications stay production/TLS by default.
        environment 'P2P_PROFILE', 'development'
        environment 'P2P_ALLOW_INSECURE_DEV', 'true'
    }
}
